<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repositorio académico</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body data-pagina="inicio">

  <header class="encabezado">
    <img src="utld.png" class="logo logo-izq" alt="Logo UTLD">

    <div class="encabezado-texto">
      <h1>Repositorio académico</h1>
      <p>5.º cuatrimestre | TSU Energía Turbo-Solar</p>
    </div>

    <img src="renders.png" class="logo logo-der" alt="Logo del programa educativo">
  </header>

  <main class="pagina-inicio">
    <section class="presentacion-inicio">
      <h2>Selecciona una asignatura</h2>
      <p>
        Accede a presentaciones, documentos, videos y materiales
        organizados por unidad.
      </p>
    </section>

    <div id="estado" class="estado">Cargando asignaturas...</div>
    <section id="lista-asignaturas" class="asignaturas"></section>
  </main>

  <footer>
    Universidad Tecnológica de La Laguna Durango |
    TSU Energía Turbo-Solar
  </footer>

  <script src="app.js"></script>
</body>
</html>
